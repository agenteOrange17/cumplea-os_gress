<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Gressia ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Cinzel+Decorative:wght@700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="loader" id="loader">Preparando algo especial para Gressia…</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <img id="modalImg" alt="">
    <div id="modalLive"></div>
    <p id="modalCaption"></p>
  </div>
</div>

<!-- carta en pergamino (nivel 5): se desenrolla y las palabras aparecen escritas con pluma -->
<div class="carta" id="carta" role="dialog" aria-modal="true" aria-label="Carta de cumpleaños">
  <!-- bordes irregulares del papel -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="cartaRough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="carta-scroll" id="cartaScroll">
    <button class="carta-close" id="cartaClose" aria-label="Cerrar">✕</button>
    <div class="carta-curl top"><svg class="carta-cap l" viewBox="0 0 34 34"></svg><svg class="carta-cap r" viewBox="0 0 34 34"></svg></div>
    <div class="carta-paper">
      <div class="carta-sheet" id="cartaSheet">
        <div class="carta-inner" id="cartaText"></div>
        <svg class="carta-quill" id="cartaQuill" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="cartaQuillG" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffdf6"/><stop offset=".6" stop-color="#eadcc0"/><stop offset="1" stop-color="#b59a72"/>
            </linearGradient>
          </defs>
          <path d="M62 2C44 4 26 16 16 36c-2 4-3 8-4 12 4-2 8-4 12-7C38 30 52 16 62 2z" fill="url(#cartaQuillG)" stroke="#a68c66" stroke-width=".8"/>
          <path d="M50 10l-8 2M44 16l-9 2M38 22l-9 3M32 28l-8 3M26 34l-7 3M54 8l4 6M48 14l5 6M42 20l4 7M36 26l4 6M30 32l3 6" stroke="#cbb791" stroke-width=".7" fill="none"/>
          <path d="M62 2 14 48" stroke="#7a5a36" stroke-width="1.5" fill="none"/>
          <path d="M15 47 3 61l9-11z" fill="#2a1a0e"/>
        </svg>
      </div>
    </div>
    <div class="carta-curl bottom"><svg class="carta-cap l" viewBox="0 0 34 34"></svg><svg class="carta-cap r" viewBox="0 0 34 34"></svg></div>
  </div>
  <p class="carta-hint" id="cartaHint">Toca la carta para leerla completa</p>
</div>

<!-- álbum de fotos (nivel 4) -->
<div class="album" id="album" role="dialog" aria-modal="true" aria-label="Álbum de fotos">
  <button class="album-close" id="albumClose" aria-label="Cerrar">✕</button>
  <div class="album-scene" id="albumScene">
    <div class="book-fly" id="bookFly"><div class="book" id="book"></div></div>
  </div>
  <div class="album-nav">
    <button id="albumPrev" aria-label="Página anterior">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span id="albumCount" aria-live="polite"></span>
    <button id="albumNext" aria-label="Página siguiente">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none"><path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- reproductor de Super Junior -->
<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Reproductor de Super Junior">
  <div class="pl-card" id="plCard">
    <button class="pl-close" id="plClose" aria-label="Cerrar">✕</button>
    <section class="pl-now">
      <div class="pl-toggle">
        <button data-mode="song" class="on">Canción</button>
        <button data-mode="video">Video</button>
      </div>
      <div class="pl-stage" id="plStage">
        <div class="vinyl"><div class="vinyl-label"><b id="vinylTitle"></b><small>SUPER JUNIOR</small></div></div>
        <div class="tonearm"></div>
        <div id="plMiniSlot" style="position:absolute; right:0; bottom:0; width:34%; aspect-ratio:16/9;"></div>
      </div>
      <div class="pl-meta">
        <h3 id="plTitle"></h3>
        <p id="plSub"></p>
      </div>
      <div class="pl-progress">
        <span id="plCur">0:00</span>
        <input type="range" id="plSeek" min="0" max="1000" value="0" aria-label="Progreso">
        <span id="plDur">0:00</span>
      </div>
      <div class="pl-controls">
        <button id="plShuffle" aria-label="Aleatorio" title="Aleatorio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button id="plPrev" aria-label="Anterior">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="plPlay" class="big" aria-label="Reproducir">
          <svg id="icoPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icoPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button id="plNext" aria-label="Siguiente">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <button id="plRepeat" aria-label="Repetir" title="Repetir canción">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        </button>
      </div>
      <div class="pl-vol">
        <span>🔈</span><input type="range" id="plVol" min="0" max="100" value="80" aria-label="Volumen"><span>🔊</span>
      </div>
      <p class="pl-note" id="plNote"></p>
    </section>
    <section class="pl-list">
      <header class="pl-head">
        <div class="pl-cover">
          <span style="background:#2f5fd0">SJ</span><span style="background:#eef3ff;color:#2f5fd0">E.L.F</span>
          <span style="background:#121a3a;color:#8fb0ff">2005</span><span style="background:#8fb0ff;color:#121a3a">♥</span>
        </div>
        <div>
          <small>PLAYLIST</small>
          <h2 id="plListTitle"></h2>
          <p id="plListSub"></p>
        </div>
      </header>
      <ol class="pl-tracks" id="plTracks"></ol>
    </section>
  </div>
</div>
<div class="yt-wrap" id="ytWrap">
  <div id="ytPlayer"></div>
  <div class="mini-bar">
    <span id="miniTitle"></span>
    <button id="miniToggle" aria-label="Pausar o reproducir">⏸</button>
    <button id="miniOpen" aria-label="Abrir reproductor">⤢</button>
    <button id="miniStop" aria-label="Detener">✕</button>
  </div>
</div>

<!-- iPod tirado en el piso 3: una lista con The Cure y Josean Log -->
<div class="ipod" id="ipod" role="dialog" aria-modal="true" aria-label="iPod">
  <canvas class="ipod-glow" id="ipodGlow" width="32" height="18" aria-hidden="true"></canvas>
  <button class="ipod-close" id="ipodClose" aria-label="Cerrar">✕</button>
  <div class="ipod-fly" id="ipodFly">
    <div class="ipod-body" id="ipodBody">
      <div class="ip-screen" id="ipScreen">
        <canvas class="ip-back" id="ipBack" width="18" height="32" aria-hidden="true"></canvas>
        <video id="ipVideo" playsinline preload="metadata"></video>
        <div class="ip-album" id="ipAlbum">
          <div class="ip-art">
            <div class="ip-cd"></div>
            <img id="ipCover" alt="Portada del disco">
          </div>
          <b id="ipAlbT"></b>
          <span id="ipAlbA"></span>
          <small id="ipAlbAl"></small>
          <em id="ipAlbN"></em>
        </div>
        <div class="ip-toast" id="ipToast" aria-live="polite"><small id="ipToastN"></small><b id="ipToastT"></b><span id="ipToastA"></span></div>
        <div class="ip-flash" id="ipFlash" aria-hidden="true"></div>
        <ul class="ip-menu" id="ipMenu"></ul>
        <div class="ip-bar">
          <span id="ipBarTitle">Reproduciendo</span>
          <svg class="ip-state" id="ipState" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <i class="ip-batt"></i>
        </div>
        <div class="ip-foot">
          <div class="ip-seek">
            <span id="ipCur">0:00</span>
            <input type="range" id="ipSeek" min="0" max="1000" value="0" aria-label="Progreso">
            <span id="ipLeft">-0:00</span>
          </div>
          <div class="ip-vol" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7z"/></svg>
            <div class="ip-volbar"><i id="ipVolFill"></i></div>
          </div>
        </div>
        <p class="ip-error" id="ipError" hidden>No se pudo cargar la canción 😿</p>
        <div class="ip-boot" aria-hidden="true"><span>♪</span></div>
        <div class="ip-gloss" aria-hidden="true"></div>
      </div>
      <div class="ip-wheel" id="ipWheel">
        <button class="ip-w-menu" id="ipMenuBtn" aria-label="Menú">MENU</button>
        <button class="ip-w-prev" id="ipPrev" aria-label="Canción anterior (mantén presionado para retroceder)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 5v14L2 12zM21 5v14l-9-7z"/></svg>
        </button>
        <button class="ip-w-next" id="ipNext" aria-label="Siguiente canción (mantén presionado para adelantar)">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14l9-7zM13 5v14l9-7z"/></svg>
        </button>
        <button class="ip-w-play" id="ipPlay" aria-label="Reproducir o pausar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5v14l10-7zM14 5h3v14h-3zM19 5h3v14h-3z"/></svg>
        </button>
        <button class="ip-center" id="ipCenter" aria-label="Seleccionar"></button>
      </div>
    </div>
  </div>
  <p class="ipod-hint" id="ipodHint"></p>
</div>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="hint" id="hint">✨ Haz clic en las cosas</div>
    <div class="viewctl" id="viewctl">
      <button class="zoom" id="zoomOut" aria-label="Alejar">−</button>
      <button class="zoom" id="zoomIn" aria-label="Acercar">+</button>
      <button id="closeBtn">🔍 Ver de cerca</button>
    </div>
    <div class="toast" id="toast"></div>
    <div class="selector">
      <button id="down" aria-label="Nivel anterior">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="levelLabel">Nivel 01</span>
      <button id="up" aria-label="Nivel siguiente">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.5 10L8 5.5 12.5 10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </main>

  <aside class="panel">
    <div class="content" id="content">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="meta">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.3-9.2C1.5 8.6 3.6 5 7 5c2 0 3.3 1.1 5 3 1.7-1.9 3-3 5-3 3.4 0 5.5 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>
        <span id="meta"></span>
      </p>
      <p class="desc" id="desc"></p>
      <button class="action" id="action"></button>
      <ol class="list" id="list"></ol>
    </div>
  </aside>
</div>

  }
}
</script>

const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0, ...opts }));
  }
  return matCache.get(key);
}
const M = (c) => (typeof c === 'string' ? mat(c) : c);

function mesh(geo, material) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = m.receiveShadow = true;
  return m;
}

const geoCache = new Map();
function rbox(w, h, d, c, r = 0.06) {
  r = Math.max(0.002, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
  const key = [w, h, d, r].join();
  if (!geoCache.has(key)) geoCache.set(key, new RoundedBoxGeometry(w, h, d, 3, r));
  return mesh(geoCache.get(key), M(c));
}
// las geometrías iguales se comparten (cientos de esferas/cilindros repetidos)
const geo = (key, make) => (geoCache.has(key) ? geoCache.get(key) : geoCache.set(key, make()).get(key));
const cyl = (rt, rb, h, c, seg = 28) => mesh(geo(`c${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)), M(c));
const ball = (r, c, seg = 24) => mesh(geo(`s${r},${seg}`, () => new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75))), M(c));
const cone = (r, h, c, seg = 20) => mesh(geo(`k${r},${h},${seg}`, () => new THREE.ConeGeometry(r, h, seg)), M(c));
const torus = (r, t, c) => mesh(geo(`t${r},${t}`, () => new THREE.TorusGeometry(r, t, 12, 40)), M(c));
const capsule = (r, l, c) => mesh(geo(`p${r},${l}`, () => new THREE.CapsuleGeometry(r, l, 6, 14)), M(c));

function put(parent, obj, x = 0, y = 0, z = 0) {
  obj.position.set(x, y, z);
  parent.add(obj);
  return obj;
}
function noShadow(obj) {
  obj.traverse((o) => { o.userData.noShadow = true; o.castShadow = false; });
  return obj;
}
// zona de clic invisible (para objetos pequeños o delgados)
function hitArea(parent, geo, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false }));
  return noShadow(put(parent, m, x, y, z));
}

const UP = new THREE.Vector3(0, 1, 0);
function rod(parent, a, b, r, c) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = cyl(r, r, d.length(), c, 10);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  parent.add(m);
  return m;
}

function sagPoint(a, b, sag, t) {
  const p = new THREE.Vector3().lerpVectors(a, b, t);
  p.y -= sag * 4 * t * (1 - t);
  return p;
}
function wire(parent, a, b, sag, color = '#ffffff') {
  const pts = [];
  for (let i = 0; i <= 28; i++) pts.push(sagPoint(a, b, sag, i / 28));
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 })
  );
  parent.add(line);
  return line;
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function fitFont(ctx, text, weight, size, maxW) {
  ctx.font = `${weight} ${size}px Outfit, sans-serif`;
  const w = ctx.measureText(text).width;
  if (w > maxW) size *= maxW / w;
  return `${weight} ${size}px Outfit, sans-serif`;
}

function wallLabel(parent, num, word, x, y, z, color = 'rgba(255,255,255,0.94)', size = 3) {
  const tex = canvasTex(1024, 1024, (ctx) => {
    ctx.fillStyle = color;
    ctx.font = '800 560px Outfit, sans-serif';
    ctx.fillText(num, 16, 560);
    ctx.font = fitFont(ctx, word, 700, 168, 960);
    ctx.fillText(word, 36, 770);
  });
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.9, depthWrite: false })
  );
  m.receiveShadow = true;
  noShadow(m);
  return put(parent, m, x, y, z);
}

function wallFrame(parent, w, h, bg, main, caption, x, y, z, rotY = 0, fg = '#ffffff') {
  const g = new THREE.Group();
  put(g, rbox(w + 0.16, h + 0.16, 0.06, '#ffffff', 0.03), 0, 0, 0);
  const cw = 512, ch = Math.round(512 * h / w);
  const tex = canvasTex(cw, ch, (ctx) => {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = fg;
    const size = Math.min(cw * 0.6, caption ? ch * 0.42 : ch * 0.55);
    const isEmoji = /\p{Extended_Pictographic}/u.test(main);
    ctx.font = isEmoji ? `${size}px serif` : fitFont(ctx, main, 800, size, cw * 0.85);
    ctx.fillText(main, cw / 2, caption ? ch * 0.4 : ch / 2);
    if (caption) {
      ctx.font = fitFont(ctx, caption, 800, Math.min(ch * 0.16, 110), cw * 0.86);
      ctx.fillText(caption, cw / 2, ch * 0.8);
    }
  });
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }));
  pic.receiveShadow = true;
  put(g, pic, 0, 0, 0.035);
  g.rotation.y = rotY;
  return put(parent, g, x, y, z);
}

function gift(w, h, d, color, ribbon, bow = true) {
  const g = new THREE.Group();
  put(g, rbox(w, h, d, color, 0.04), 0, h / 2, 0);
  put(g, rbox(w + 0.02, h + 0.02, 0.12, ribbon, 0.02), 0, h / 2, 0);
  put(g, rbox(0.12, h + 0.02, d + 0.02, ribbon, 0.02), 0, h / 2, 0);
  if (bow) {
    const s = Math.min(w, d) / 0.9;
    const l1 = torus(0.13 * s, 0.045 * s, ribbon); l1.rotation.z = 0.55;
    const l2 = torus(0.13 * s, 0.045 * s, ribbon); l2.rotation.z = -0.55;
    put(g, l1, -0.12 * s, h + 0.1 * s, 0);
    put(g, l2, 0.12 * s, h + 0.1 * s, 0);
    put(g, ball(0.065 * s, ribbon), 0, h + 0.04, 0);
  }
  return g;
}

const eyeArcGeo = new THREE.TorusGeometry(0.05, 0.014, 6, 16, Math.PI);

      arm.rotation.set(0, 0.25, 1.3);

  if (bouquet) {

    for (const s of [-1, 1]) put(b, ball(0.04, '#4fb36b', 10), s * 0.14, 0.15, 0.02).scale.set(1.4, 0.6, 1);
  }
  const head = put(g, new THREE.Group(), 0, 0.92, 0);
  put(head, inked(ball(0.44, fur, 36), 1.035), 0, 0, 0).scale.set(1.08, 0.95, 1);
  for (const s of [-1, 1]) {
    put(head, inked(ball(0.13, ear)), s * 0.31, 0.33, -0.04);
    if (earIn) put(head, ball(0.075, earIn, 12), s * 0.31, 0.33, 0.06).scale.z = 0.45;

    bow.rotation.set(-0.3, 0.3, -0.5);
    put(bow, inked(ball(0.04, '#ff5c8a', 12), 1.12));
    for (const s of [-1, 1]) put(bow, inked(cone(0.065, 0.12, '#ff5c8a', 12), 1.08), s * 0.08, 0, 0).rotation.z = -s * Math.PI / 2;
  } else {
    put(head, ball(0.03, '#2b2024', 10), 0, -0.06, 0.435).scale.set(1.3, 0.8, 0.5);
  }
  g.userData.head = head;
  return g;
}
function bearCouple(level, msg) {
  const g = new THREE.Group();
  // Dudu: osito café · Bubu: osita blanca tipo panda
  const dudu = put(g, bear({ fur: '#c8916a', ear: '#c8916a', earIn: '#6b4434', cheek: '#f2b24c', bouquet: true }), -0.52, 0, 0);
  const bubu = put(g, bear({ fur: '#fffdfa', ear: '#2b2024', cheek: '#ffaab8', panda: true, reach: true }), 0.52, 0, 0);
  bubu.scale.setScalar(0.92);
  dudu.rotation.y = 0.3; bubu.rotation.y = -0.35;
  const hearts = [[-1.15, 1.45, 0.1, 0.22], [1.15, 1.6, 0, 0.26], [0.0, 1.85, -0.1, 0.34], [0.6, 2.2, 0, 0.2]]
    .map(([x, y, z, s]) => {
      const hm = noShadow(put(g, mesh(heartGeo(s), mat('#ff6b7d', { roughness: 0.35 })), x, y, z));
      hm.userData.y = y;
      return hm;
    });
  const heart = hearts[2];
  let hugAt = -10;
  interactive(g, level, () => {
    hugAt = clock.elapsedTime;
    g.getWorldPosition(_v);
    confetti.burst(_v.setY(_v.y + 1.6), level * H, 70, 0.7, PINK);
    sfx.hug();
    toast(msg);
  });
  tickers.push((t) => {
    const p = (t - hugAt) / 1.6;
    const h = p < 1 ? Math.sin(p * Math.PI) : 0;
    // Bubu se recarga en Dudu (más fuerte al hacer clic)
    bubu.rotation.z = 0.1 + 0.08 * h + Math.sin(t * 1.4) * 0.02;
    bubu.position.x = 0.52 - 0.05 * h;
    bubu.position.y = Math.abs(Math.sin(t * 1.4)) * 0.02;
    dudu.rotation.z = -0.03 - 0.06 * h;
    dudu.position.x = -0.52 + 0.03 * h;
    bubu.userData.head.rotation.x = Math.sin(t * 1.5) * 0.04;
    dudu.userData.head.rotation.x = Math.sin(t * 1.5 + 1) * 0.04;
    hearts.forEach((hm, k) => {
      hm.position.y = hm.userData.y + Math.sin(t * 2 + k * 1.3) * 0.07 + h * 0.15;
      hm.rotation.y = Math.sin(t * 0.8 + k) * 0.5;
      hm.scale.setScalar(1 + 0.35 * h + Math.sin(t * 5 + k) * 0.05);
    });
    heart.rotation.y = Math.sin(t * 0.8) * 0.6;
  });
  return g;
}

/* =========================================================
   Estructura de cada nivel (piso, muros, escalera)

function buildShell(g, p, { roof = false, base = false, stairs = true } = {}) {
  const slabH = base ? 1.2 : 0.4;
  noShadow(put(g, rbox(8.4, slabH, 8.4, p.slab, 0.08), 0, -slabH / 2, 0));

  if (roof) {
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      put(g, rbox(0.96, 0.05, 0.96, (i + j) % 2 ? p.floor : p.floor2, 0.02), -3.3 + i, 0.025, -3.3 + j);
    }
    put(g, rbox(0.4, 1.5, 8.4, p.wall, 0.06), -4, 0.35, 0);
    put(g, rbox(8.0, 1.5, 0.4, p.wall, 0.06), 0.2, 0.35, -4);
    put(g, rbox(0.6, 0.12, 8.6, p.trim, 0.04), -4, 1.16, 0);
    put(g, rbox(8.2, 0.12, 0.6, p.trim, 0.04), 0.3, 1.16, -4);
  } else {
    for (let i = 0; i < 8; i++) {
      put(g, rbox(0.97, 0.05, 7.96, i % 2 ? p.floor : p.floor2, 0.02), -3.3 + i, 0.025, 0.2);
    }
    put(g, rbox(0.4, H, 8.4, p.wall, 0.06), -4, H / 2 - 0.4, 0);
    put(g, rbox(8.0, H, 0.4, p.accent, 0.06), 0.2, H / 2 - 0.4, -4);
  }

  if (stairs) {
    // bloque de escalera en la esquina trasera derecha, subiendo hacia el fondo
    const N = 12, run = 4.6 / N, rise = H / N;
    for (let i = 0; i < N; i++) {
      const h = (i + 1) * rise + slabH;
      put(g, rbox(3.6, h, run, p.stairs, 0.03), 6.0, -slabH + h / 2, -4.2 - (i + 0.5) * run);
    }
  }
}

/* ---------- efectos de sonido (sintetizados con Web Audio, sin archivos) ---------- */
const sfx = (() => {
  let ac, out, noiseBuf;
  const ctx = () => {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      out = ac.createGain(); out.gain.value = 0.7;
      out.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  // tono con envolvente rápida
  const tone = (f, t0, dur, { type = 'sine', vol = 0.2, f2 = null, attack = 0.005 } = {}) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(out);
    o.start(t0); o.stop(t0 + dur + 0.02);
  };
  // ráfaga de ruido filtrado
  const noise = (t0, dur, { vol = 0.3, type = 'bandpass', f = 1500, f2 = null, q = 1 } = {}) => {
    const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf;
    fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t0);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl).connect(g).connect(out);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
  };
  const play = (fn) => () => { try { if (ctx()) fn(ac.currentTime + 0.01); } catch (e) {} };
  const arp = (t, notes, step, opts) => notes.forEach((f, i) => tone(f, t + i * step, opts.dur || 0.5, opts));
  return {
    // globo reventando: chasquido seco + golpe grave
    pop: play((t) => {
      noise(t, 0.09, { vol: 0.9, type: 'highpass', f: 900, q: 0.7 });
      noise(t, 0.18, { vol: 0.5, type: 'lowpass', f: 2500, f2: 300 });
      tone(180, t, 0.12, { vol: 0.5, f2: 50 });
    }),
    // regalo: papel que se rompe + campanitas
    gift: play((t) => {
      for (let i = 0; i < 5; i++) noise(t + i * 0.045, 0.06, { vol: 0.25, f: 2500 + Math.random() * 2500, q: 2 });
      arp(t + 0.22, [784, 988, 1175, 1568, 1976], 0.07, { type: 'triangle', vol: 0.14, dur: 0.7 });
      arp(t + 0.22, [1568, 1976, 2349, 3136], 0.09, { vol: 0.05, dur: 0.5 });
    }),
    // soplar velas: soplido + fanfarria
    blow: play((t) => {
      noise(t, 0.6, { vol: 0.35, type: 'bandpass', f: 600, f2: 1800, q: 0.6 });
      arp(t + 0.45, [523, 659, 784, 1047], 0.11, { type: 'triangle', vol: 0.15, dur: 0.6 });
      tone(1319, t + 0.9, 0.9, { type: 'triangle', vol: 0.1 });
    }),
    light: play((t) => { tone(1200, t, 0.25, { vol: 0.08, f2: 1800 }); noise(t, 0.15, { vol: 0.1, f: 3000 }); }),
    // magia (varita, caldero, snitch, sombrero)
    sparkle: play((t) => {
      for (let i = 0; i < 9; i++) tone(1400 + Math.random() * 2200, t + i * 0.05, 0.35, { vol: 0.06 });
      tone(600, t, 0.6, { type: 'triangle', vol: 0.08, f2: 1400 });
    }),
    bubble: play((t) => { for (let i = 0; i < 6; i++) tone(300 + Math.random() * 300, t + i * 0.08, 0.1, { vol: 0.15, f2: 900 + Math.random() * 500 }); }),
    hoot: play((t) => { tone(420, t, 0.25, { vol: 0.2, f2: 380, attack: 0.05 }); tone(400, t + 0.35, 0.45, { vol: 0.2, f2: 340, attack: 0.06 }); }),
    meow: play((t) => {
      tone(650, t, 0.45, { type: 'sawtooth', vol: 0.05, f2: 900, attack: 0.06 });
      tone(900, t + 0.2, 0.35, { type: 'sine', vol: 0.08, f2: 520, attack: 0.03 });
    }),
    purr: play((t) => {
      for (let i = 0; i < 14; i++) noise(t + i * 0.09, 0.07, { vol: 0.22, type: 'lowpass', f: 220, q: 1 });
    }),
    // polvos flu: llamarada que sube + campanitas
    floo: play((t) => {
      noise(t, 0.9, { vol: 0.45, type: 'bandpass', f: 250, f2: 2600, q: 0.8 });
      for (let i = 0; i < 6; i++) tone(520 + i * 170, t + 0.3 + i * 0.06, 0.45, { type: 'triangle', vol: 0.06 });
    }),
    hug: play((t) => { arp(t, [523, 659, 784], 0.12, { type: 'sine', vol: 0.12, dur: 0.6 }); }),
    // rasgueo de charango + frase de quena (pentatónica andina)
    andes: play((t) => {
      arp(t, [330, 392, 494, 659], 0.018, { type: 'triangle', vol: 0.1, dur: 0.5 });
      [659, 784, 880, 988, 1175, 988, 880, 784, 659].forEach((f, i) => {
        tone(f, t + 0.25 + i * 0.13, 0.32, { vol: 0.11, attack: 0.03 });
        tone(f / 2, t + 0.25 + i * 0.13, 0.3, { type: 'triangle', vol: 0.03, attack: 0.03 });
      });
    }),
    // las alpacas "zumban"
    // fuego artificial: estallido suave + chisporroteo (se limita si explotan varios a la vez)
    boom: (() => {
      let last = 0;
      return play((t) => {
        if (t - last < 0.15) return;
        last = t;
        noise(t, 0.5, { vol: 0.35, type: 'lowpass', f: 900, f2: 120 });
        tone(110, t, 0.35, { vol: 0.25, f2: 45 });
        for (let i = 0; i < 10; i++) noise(t + 0.15 + Math.random() * 0.7, 0.03, { vol: 0.08, type: 'highpass', f: 4000 });
      });
    })(),
    hum: play((t) => { tone(250, t, 0.5, { vol: 0.16, f2: 310, attack: 0.1 }); tone(310, t + 0.45, 0.4, { vol: 0.14, f2: 230, attack: 0.06 }); }),
    whoosh: play((t) => { noise(t, 0.6, { vol: 0.3, f: 350, f2: 2200, q: 0.8 }); tone(500, t + 0.1, 0.4, { vol: 0.04, f2: 1200 }); }),
  };
})();

/* ---------- confeti ---------- */
class Confetti {
  constructor(n = 700) {
    this.n = n;
    this.i = 0;
    this.c = new THREE.Color();
    this.mesh = new THREE.InstancedMesh(
      new THREE.PlaneGeometry(0.09, 0.16),
      new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.6 }),
      n
    );
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled = false;
    for (let i = 0; i < n; i++) this.mesh.setColorAt(i, this.c.set(PALETTE[i % PALETTE.length]));
    this.p = new Float32Array(n * 3);
    this.v = new Float32Array(n * 3);
    this.r = new Float32Array(n * 3);
    this.rv = new Float32Array(n * 3);
    this.life = new Float32Array(n);
    this.floor = new Float32Array(n);
    this.dummy = new THREE.Object3D();
    this.dummy.scale.setScalar(0);
    this.dummy.updateMatrix();
    for (let i = 0; i < n; i++) this.mesh.setMatrixAt(i, this.dummy.matrix);
    scene.add(this.mesh);
  }
  burst(origin, floorY, count = 120, power = 1, colors = PALETTE) {
    for (let k = 0; k < count; k++) {
      const i = this.i++ % this.n, j = i * 3;
      this.mesh.setColorAt(i, this.c.set(colors[k % colors.length]));
      this.p[j] = origin.x + rand(-0.2, 0.2);
      this.p[j + 1] = origin.y + rand(0, 0.2);
      this.p[j + 2] = origin.z + rand(-0.2, 0.2);
      const a = Math.random() * Math.PI * 2, s = rand(0.6, 2.6) * power;
      this.v[j] = Math.cos(a) * s;
      this.v[j + 1] = rand(3.5, 7) * power;
      this.v[j + 2] = Math.sin(a) * s;
      for (let q = 0; q < 3; q++) { this.r[j + q] = rand(0, 6); this.rv[j + q] = rand(-9, 9); }
      this.life[i] = rand(4, 6);
      this.floor[i] = floorY + 0.08;
    }
    this.mesh.instanceColor.needsUpdate = true;
  }
  update(dt, t) {
    const d = this.dummy;
    const drag = Math.pow(0.35, dt);
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) continue;
      const j = i * 3;
      this.life[i] -= dt;
      if (this.p[j + 1] > this.floor[i]) {
        this.v[j + 1] -= 9 * dt;
        this.v[j] *= drag; this.v[j + 1] *= drag; this.v[j + 2] *= drag;
        this.p[j] += (this.v[j] + Math.sin(t * 3 + i) * 0.4) * dt;
        this.p[j + 1] += this.v[j + 1] * dt;
        this.p[j + 2] += this.v[j + 2] * dt;
        for (let q = 0; q < 3; q++) this.r[j + q] += this.rv[j + q] * dt;
      } else {
        this.p[j + 1] = this.floor[i];
        this.r[j] = -Math.PI / 2; this.r[j + 2] = 0;
      }
      d.position.set(this.p[j], this.p[j + 1], this.p[j + 2]);
      d.rotation.set(this.r[j], this.r[j + 1], this.r[j + 2]);
      d.scale.setScalar(Math.min(1, this.life[i] / 0.8));
      d.updateMatrix();
      this.mesh.setMatrixAt(i, d.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

/* ---------- chispas y fuegos artificiales ---------- */
const sparkMat = new THREE.ShaderMaterial({
  uniforms: { uPR: { value: renderer.getPixelRatio() } },
  vertexShader: /* glsl */`
    uniform float uPR;
    attribute vec3 tint;
    attribute float size;
    attribute float alpha;
    varying vec3 vTint;
    varying float vAlpha;
    void main() {
      vTint = tint;
      vAlpha = alpha;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPR;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vTint;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float a = pow(max(0.0, 1.0 - d), 1.6);
      float core = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(mix(vTint, vec3(1.0), core * 0.6), a * vAlpha);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
// colores en sRGB tal cual (el shader no hace conversión de espacio de color)
const rgbCache = new Map();
function rgb(hex) {
  if (!rgbCache.has(hex)) rgbCache.set(hex, new THREE.Color(hex).convertLinearToSRGB().toArray());
  return rgbCache.get(hex);
}
const anyOf = (arr) => arr[Math.floor(Math.random() * arr.length)];
// ejes "derecha" y "arriba" de la pantalla, en coordenadas del mundo
function screenAxes() {
  const e = camera.matrixWorld.elements;
  return [new THREE.Vector3(e[0], e[1], e[2]), new THREE.Vector3(e[4], e[5], e[6])];
}

function sparkPoints(n) {
  const g = new THREE.BufferGeometry();
  const attrs = {
    position: new THREE.BufferAttribute(new Float32Array(n * 3), 3),
    tint: new THREE.BufferAttribute(new Float32Array(n * 3), 3),
    size: new THREE.BufferAttribute(new Float32Array(n), 1),
    alpha: new THREE.BufferAttribute(new Float32Array(n), 1),
  };
  for (const k in attrs) g.setAttribute(k, attrs[k].setUsage(THREE.DynamicDrawUsage));
  const pts = new THREE.Points(g, sparkMat);
  pts.frustumCulled = false;
  pts.raycast = () => {};            // que no tapen los clics
  return { pts, attrs };
}

class Sparks {
  constructor(parent, n = 3000) {
    this.n = n;
    this.i = 0;
    const { pts, attrs } = sparkPoints(n);
    this.attrs = attrs;
    this.p = attrs.position.array; this.c = attrs.tint.array;
    this.s = attrs.size.array; this.a = attrs.alpha.array;
    this.v = new Float32Array(n * 3);
    this.life = new Float32Array(n); this.max = new Float32Array(n); this.s0 = new Float32Array(n);
    this.grav = new Float32Array(n); this.drag = new Float32Array(n); this.flick = new Uint8Array(n);
    this.rockets = [];
    this.flyers = [];
    parent.add(pts);
  }
  spawn(x, y, z, vx, vy, vz, color, life, size, grav = 1.5, drag = 1.3, flick = false) {
    const i = this.i++ % this.n, j = i * 3;
    const [r, g, b] = rgb(color);
    this.p[j] = x; this.p[j + 1] = y; this.p[j + 2] = z;
    this.v[j] = vx; this.v[j + 1] = vy; this.v[j + 2] = vz;
    this.c[j] = r; this.c[j + 1] = g; this.c[j + 2] = b;
    this.life[i] = this.max[i] = life;
    this.s0[i] = size; this.grav[i] = grav; this.drag[i] = drag; this.flick[i] = flick ? 1 : 0;
    this.idle = false;
  }
  // cohete con estela que sube de (x,y,z) y explota en (tx,ty,tz) tras T segundos
  rocket(x, y, z, tx, ty, tz, T, onBurst, { trail = GOLD, big = false } = {}) {
    const g = 2.5;
    this.rockets.push({ x, y, z, vx: (tx - x) / T, vy: (ty - y) / T + 0.5 * g * T, vz: (tz - z) / T, g, fuse: T, onBurst, trail, big });
  }
  // chispa que vuela siguiendo path(u) con u de 0 a 1 (dragón, snitch…)
  fly(dur, path, { head = '#ffffff', trail = GOLD, size = 6, wings = false, breath = false, onEnd } = {}) {
    this.flyers.push({ t: 0, dur, path, head, trail, size, wings, breath, onEnd, p: new THREE.Vector3(), q: new THREE.Vector3() });
  }
  update(dt, t) {
    // sin chispas vivas no hay nada que mover ni que subir a la GPU
    if (this.idle && !this.rockets.length && !this.flyers.length) return;
    for (let k = this.rockets.length - 1; k >= 0; k--) {
      const r = this.rockets[k];
      r.vy -= r.g * dt;
      r.x += r.vx * dt; r.y += r.vy * dt; r.z += r.vz * dt;
      r.fuse -= dt;
      for (let q = 0; q < (r.big ? 7 : 3); q++) {
        this.spawn(r.x + rand(-0.04, 0.04), r.y, r.z + rand(-0.04, 0.04), rand(-0.3, 0.3), rand(-0.7, -0.1), rand(-0.3, 0.3),
          anyOf(r.trail), rand(0.35, 0.75), r.big ? rand(7, 11) : rand(3.5, 5.5), 1, 2, true);
      }
      this.spawn(r.x, r.y, r.z, 0, 0, 0, '#ffffff', 0.05, r.big ? 20 : 10, 0, 0);
      if (r.fuse <= 0) { this.rockets.splice(k, 1); r.onBurst?.(r.x, r.y, r.z); }
    }
    for (let k = this.flyers.length - 1; k >= 0; k--) {
      const f = this.flyers[k];
      f.t += dt;
      const u = Math.min(1, f.t / f.dur);
      const p = f.path(u, f.p);
      for (let q = 0; q < 6; q++) {
        this.spawn(p.x + rand(-0.06, 0.06), p.y + rand(-0.06, 0.06), p.z + rand(-0.06, 0.06), rand(-0.25, 0.25), rand(-0.25, 0.25), rand(-0.25, 0.25),
          anyOf(f.trail), rand(0.6, 1.1), rand(f.size * 0.6, f.size), 0.4, 1.5, Math.random() < 0.3);
      }
      this.spawn(p.x, p.y, p.z, 0, 0, 0, f.head, 0.05, f.size * 2.6, 0, 0);
      if (f.wings) {
        const [R, U] = screenAxes();
        const flap = 0.22 + Math.abs(Math.sin(t * 28)) * 0.14;
        for (const s of [-1, 1]) {
          this.spawn(p.x + R.x * s * flap + U.x * 0.08, p.y + R.y * s * flap + U.y * 0.08, p.z + R.z * s * flap + U.z * 0.08,
            0, 0, 0, '#ffffff', 0.06, 8, 0, 0);
        }
      }
      if (f.breath && Math.sin(t * 5) > 0.6) {
        // llamarada hacia delante
        const d = f.path(Math.min(1, u + 0.01), f.q).sub(p).normalize();
        for (let q = 0; q < 5; q++) {
          const s = rand(2.5, 4);
          this.spawn(p.x, p.y, p.z, d.x * s + rand(-0.5, 0.5), d.y * s + rand(-0.5, 0.5), d.z * s + rand(-0.5, 0.5),
            anyOf(['#ffd36b', '#ff9a2e', '#ffffff']), rand(0.3, 0.55), rand(6, 9), 0.5, 2.5, true);
        }
      }
      if (u >= 1) { this.flyers.splice(k, 1); f.onEnd?.(p.x, p.y, p.z); }
    }
    let alive = 0;
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.a[i] = 0; continue; }
      alive++;
      const j = i * 3;
      this.life[i] -= dt;
      const k = Math.exp(-this.drag[i] * dt);
      this.v[j] *= k; this.v[j + 1] = this.v[j + 1] * k - this.grav[i] * dt; this.v[j + 2] *= k;
      this.p[j] += this.v[j] * dt; this.p[j + 1] += this.v[j + 1] * dt; this.p[j + 2] += this.v[j + 2] * dt;
      const f = Math.max(0, this.life[i] / this.max[i]);
      this.a[i] = Math.min(1, f * 2.5) * (this.flick[i] && Math.random() < 0.45 ? 0.2 : 1);
      this.s[i] = this.s0[i] * (0.45 + 0.55 * f);
    }
    for (const k in this.attrs) this.attrs[k].needsUpdate = true;
    this.idle = alive === 0;
  }
}

// explosión de fuego artificial en (x,y,z), en coordenadas del grupo de fx
const _dir = new THREE.Vector3();
// en celular, menos chispas por explosión (se ven igual de bonitas y no traban)
const FXQ = isMobile ? 0.6 : 1;
function fwBurst(fx, x, y, z, type = 'peony', colors = PALETTE, s = 1) {
  sfx.boom();
  if (type === 'heart') {
    // corazón de cara a la cámara
    const [R, U] = screenAxes();
    const n = Math.round(140 * s * FXQ);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2;
      const hx = Math.sin(a) ** 3, hy = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 16;
      const v = 2.6 * s * rand(0.97, 1.03);
      _dir.copy(R).multiplyScalar(hx * v).addScaledVector(U, hy * v);
      fx.spawn(x, y, z, _dir.x, _dir.y, _dir.z, colors[k % colors.length], rand(1.6, 2), rand(5.5, 7.5), 0.5, 1.6, Math.random() < 0.25);
    }
  } else if (type === 'ring') {
    const [R, U] = screenAxes();
    const V = R.clone().cross(U);
    const tilt = rand(0.2, 1.1);
    const B = U.clone().multiplyScalar(Math.cos(tilt)).addScaledVector(V, Math.sin(tilt));
    const n = Math.round(110 * s * FXQ);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * Math.PI * 2, v = 3 * s * rand(0.97, 1.03);
      _dir.copy(R).multiplyScalar(Math.cos(a)).addScaledVector(B, Math.sin(a));
      fx.spawn(x, y, z, _dir.x * v, _dir.y * v, _dir.z * v, colors[k % colors.length], rand(1.4, 1.8), rand(5.5, 7.5), 1.2, 1.4, Math.random() < 0.2);
    }
    for (let k = 0; k < 30 * s * FXQ; k++) {
      _dir.randomDirection().multiplyScalar(rand(0.6, 1.2) * s);
      fx.spawn(x, y, z, _dir.x, _dir.y, _dir.z, '#ffffff', rand(0.8, 1.2), 5, 0.8, 1.5, true);
    }
  } else if (type === 'willow') {
    for (let k = 0; k < 130 * s * FXQ; k++) {
      _dir.randomDirection().multiplyScalar(rand(1.8, 2.6) * s);
      fx.spawn(x, y, z, _dir.x, _dir.y, _dir.z, anyOf(colors), rand(2.4, 3.4), rand(4, 6), 1.1, 2, true);
    }
  } else if (type === 'bolt') {
    // rayo de la frente de Harry, dibujado de cara a la cámara
    const [R, U] = screenAxes();
    const P = [[0.2, 1], [-0.35, -0.02], [0.15, 0.02], [-0.2, -1]];
    const n = Math.round(150 * s * FXQ);
    for (let k = 0; k < n; k++) {
      const u = (k / n) * 3, seg = Math.min(2, Math.floor(u)), f = u - seg;
      const px = P[seg][0] + (P[seg + 1][0] - P[seg][0]) * f, py = P[seg][1] + (P[seg + 1][1] - P[seg][1]) * f;
      const v = 2.8 * s;
      _dir.copy(R).multiplyScalar(px * v).addScaledVector(U, py * v);
      fx.spawn(x, y, z, _dir.x + rand(-0.1, 0.1), _dir.y + rand(-0.1, 0.1), _dir.z + rand(-0.1, 0.1), anyOf(colors), rand(1.5, 2), rand(5.5, 7), 0.35, 2.2, Math.random() < 0.3);
    }
  } else {
    // 'peony' (esfera) o 'glitter' (esfera que chisporrotea)
    const glitter = type === 'glitter';
    for (let k = 0; k < 150 * s * FXQ; k++) {
      _dir.randomDirection().multiplyScalar(rand(2.6, 3.3) * s);
      fx.spawn(x, y, z, _dir.x, _dir.y, _dir.z, anyOf(colors), rand(1.2, 1.9) * (glitter ? 1.3 : 1), rand(5, 8), 1.5, 1.3, glitter || Math.random() < 0.25);
    }
  }
  fx.spawn(x, y, z, 0, 0, 0, '#ffffff', 0.2, 46 * s, 0, 0);   // destello
}

function balloonCluster(L, level, anchor, specs) {
  const balloons = specs.map(([c, x, y, z], k) => {
    const b = put(L, balloon(c), x, y, z);
    Object.assign(b.userData, { base: new THREE.Vector3(x, y, z), phase: k * 1.7, popped: 0 });
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([anchor, anchor]),
      new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7 })
    );
    L.add(line);
    b.userData.line = line;
    interactive(b, level, () => {
      if (b.userData.popped > clock.elapsedTime) return;
      b.userData.popped = clock.elapsedTime + 4;
      b.getWorldPosition(_v);
      confetti.burst(_v, level * H, 60, 0.6, [c, '#ffffff']);
      sfx.pop();
      toast('🎈 ¡Pum!', 1400);
    });
    return b;
  });
  tickers.push((t, dt) => {
    for (const b of balloons) {
      const { base, phase, line, body } = b.userData;
      b.position.set(base.x + Math.sin(t * 0.7 + phase) * 0.06, base.y + Math.sin(t * 1.1 + phase) * 0.12, base.z);
      b.rotation.z = Math.sin(t * 0.9 + phase) * 0.08;
      const alive = b.userData.popped < t;
      body.scale.setScalar(damp(body.scale.x, alive ? 1 : 0.001, alive ? 4 : 30, dt));
      line.visible = body.scale.x > 0.3;
      const pos = line.geometry.attributes.position;
      pos.setXYZ(1, b.position.x, b.position.y - 0.6, b.position.z);
      pos.needsUpdate = true;
    }
  });
}

// portada del disco de The Cure (dibujada aquí: flores oscuras, sin usar la imagen original)
let cureCoverCanvas = null;
function cureCover() {
  if (cureCoverCanvas) return cureCoverCanvas;
  const cv = cureCoverCanvas = document.createElement('canvas');
  cv.width = cv.height = 512;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(256, 230, 30, 256, 256, 380);
  g.addColorStop(0, '#3a2a4a'); g.addColorStop(0.6, '#1a1422'); g.addColorStop(1, '#08060c');
  c.fillStyle = g; c.fillRect(0, 0, 512, 512);
  // semilla fija: la portada sale igual en cada visita
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const tones = ['#b3263a', '#7c1f2b', '#d9d2c5', '#5f3a7a', '#c9892f', '#2f6f6a'];
  for (let k = 0; k < 46; k++) {
    const x = rnd() * 512, y = rnd() * 512, r = 18 + rnd() * 34;
    const petals = 5 + Math.floor(rnd() * 4);
    c.globalAlpha = 0.5 + rnd() * 0.45;
    c.fillStyle = tones[Math.floor(rnd() * tones.length)];
    for (let p = 0; p < petals; p++) {
      const a = (p / petals) * Math.PI * 2 + rnd();
      c.beginPath();
      c.ellipse(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.55, r * 0.3, a, 0, Math.PI * 2);
      c.fill();
    }
    c.fillStyle = '#120d18';
    c.beginPath(); c.arc(x, y, r * 0.2, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;
  const v = c.createRadialGradient(256, 256, 120, 256, 256, 370);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.8)');
  c.fillStyle = v; c.fillRect(0, 0, 512, 512);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = '#000'; c.shadowBlur = 16;
  c.fillStyle = '#f2ecdf';
  c.font = '800 66px Outfit, sans-serif';

// portada de "Chachachá": atardecer en el campo con dos siluetas de la mano (dibujada aquí)
function chachaCover() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 512;
  const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, '#231c3a'); g.addColorStop(0.42, '#6b3f5e'); g.addColorStop(0.66, '#e8925a');
  g.addColorStop(0.665, '#3b2b1a'); g.addColorStop(1, '#120c07');
  c.fillStyle = g; c.fillRect(0, 0, 512, 512);
  const sun = c.createRadialGradient(256, 340, 0, 256, 340, 190);
  sun.addColorStop(0, 'rgba(255, 220, 160, 0.95)'); sun.addColorStop(1, 'rgba(255, 150, 90, 0)');
  c.fillStyle = sun; c.fillRect(0, 150, 512, 194);
  // pasto
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  c.strokeStyle = 'rgba(20, 12, 6, 0.75)'; c.lineWidth = 2;
  for (let k = 0; k < 260; k++) {
    const x = rnd() * 512, y = 345 + rnd() * 170;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + (rnd() - 0.5) * 8, y - 6 - rnd() * 12); c.stroke();
  }
  // dos siluetas de la mano
  c.fillStyle = c.strokeStyle = '#120a0c';
  const person = (x, foot, h) => {
    c.beginPath(); c.arc(x, foot - h * 0.89, h * 0.1, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.roundRect(x - h * 0.12, foot - h * 0.78, h * 0.24, h * 0.42, h * 0.08); c.fill();
    c.lineWidth = h * 0.08; c.lineCap = 'round';
    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + s * h * 0.05, foot - h * 0.4); c.lineTo(x + s * h * 0.09, foot); c.stroke(); }
  };
  person(222, 424, 120);
  person(292, 426, 132);
  c.lineWidth = 8;
  c.beginPath(); c.moveTo(236, 355); c.quadraticCurveTo(257, 372, 278, 354); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = 'rgba(0, 0, 0, 0.6)'; c.shadowBlur = 14;
  c.fillStyle = '#fff4e6';
  c.font = '700 116px Caveat, cursive';
  c.fillText('Chachachá', 256, 132);
  c.font = '600 34px Outfit, sans-serif';
  c.fillText('Josean Log', 256, 206);
  return cv;
}

      setTimeout(() => shoot(HOUSES[k].colors, HOUSES[k].types[0], side), 300 + q * 450));
    setTimeout(() => toast(`🎂 ¡Feliz cumpleaños, Gatito! Que este año sea mágico ✨`, 4200), 900);
    setTimeout(() => { if (state.level === LV && !done[LV][7]) toast('💌 Hay una carta lacrada flotando en la torre… es para ti', 4200); }, 5600);
  };
  CONFIG.levels[LV].unlock = () => {
    if (finaleUnlocked) return;
    finaleUnlocked = true;
    L.visible = true;
    L.scale.setScalar(0.05);
    unlockAt = clock.elapsedTime + 0.3;
    goTo(LV);
    setTimeout(shockwave, 1500);
  };
  buildText();
}

// el pergamino se desenrolla, una pluma escribe palabra por palabra (la tinta se traza de izquierda

const carta = { open: false, timers: [], words: [], i: 0, read: false };
// los extremos enrollados del papel muestran la espiral del rollo
{

// adorno caligráfico bajo el título, con un corazoncito al centro (se dibuja solo)
const CARTA_FLOURISH = '<svg class="carta-flourish" viewBox="0 0 300 40" aria-hidden="true">'
  + '<path pathLength="1" d="M150 16c-9-11-25-11-29-1-3 8 7 12 12 6M150 16c9-11 25-11 29-1 3 8-7 12-12 6M121 20C93 29 62 6 32 16c-10 3-17 9-26 7M179 20c28 9 59-14 89-4 10 3 17 9 26 7"/>'
  + '<path pathLength="1" class="h" d="M150 36c-4-3-8-6-8-10a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-4 7-8 10z"/></svg>';

// sello de lacre: borde irregular de cera derramada, aro presionado, letra en relieve y dos cintas
function waxSeal(letter) {
  let seed = 9;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const blob = (R, wob, n) => {
    const pts = Array.from({ length: n }, (_, k) => {
      const a = (k / n) * Math.PI * 2, r = R + (rnd() - 0.5) * wob;
      return [Math.cos(a) * r, Math.sin(a) * r];
    });
    const f = (v) => v.toFixed(1);
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const m0 = mid(pts[n - 1], pts[0]);
    let d = `M${f(m0[0])} ${f(m0[1])}`;
    pts.forEach((p, k) => { const m = mid(p, pts[(k + 1) % n]); d += `Q${f(p[0])} ${f(p[1])} ${f(m[0])} ${f(m[1])}`; });
    return `${d}Z`;
  };
  const outer = blob(44, 8, 22), rim = blob(32, 2.2, 18);
  const dots = Array.from({ length: 16 }, (_, k) => {
    const a = (k / 16) * Math.PI * 2;
    return `<circle cx="${(Math.cos(a) * 25.5).toFixed(1)}" cy="${(Math.sin(a) * 25.5).toFixed(1)}" r="${k % 2 ? 0.9 : 1.5}"/>`;
  }).join('');
  const txt = (fill, dx, dy) => `<text x="${dx}" y="${12 + dy}" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36" fill="${fill}">${letter}</text>`;
  return `<svg viewBox="-60 -54 120 132" aria-hidden="true">

      <linearGradient id="waxR" x1="0" x2="1"><stop offset="0" stop-color="#6e0d1f"/><stop offset=".5" stop-color="#a51d36"/><stop offset="1" stop-color="#7a1124"/></linearGradient>
    </defs>
    <path d="M-12 18 -34 72 -25 65 -19 76 0 24Z" fill="url(#waxR)"/>
    <path d="M12 18 34 70 24 64 19 75 0 24Z" fill="url(#waxR)"/>
    <path d="${outer}" fill="url(#waxA)"/>
    <path d="${rim}" fill="none" stroke="rgba(50,0,10,.5)" stroke-width="3.5" transform="translate(1.2 1.8)"/>
    <path d="${rim}" fill="url(#waxB)" stroke="rgba(255,160,175,.4)" stroke-width="1.1"/>
    <g fill="rgba(60,0,12,.55)">${dots}</g>
        ${txt('rgba(255,180,192,.6)', 1, 1.3)}${txt('#3f0410', -0.4, -0.5)}${txt('#6a0b1c', 0, 0)}
    <ellipse cx="-17" cy="-21" rx="13" ry="6" fill="rgba(255,255,255,.26)" transform="rotate(-32 -17 -21)"/>
    <ellipse cx="22" cy="24" rx="5" ry="2.4" fill="rgba(255,255,255,.14)" transform="rotate(-38 22 24)"/>
  </svg>`;
}
function buildCarta() {
  const C = CONFIG.carta;
  // cada palabra con su propio pulso: tinta un poco más clara u oscura, y la línea no del todo recta
  const words = (txt) => txt.split(/\s+/).filter(Boolean).map((w) => {
    const r = Math.random, d = (0.1 + w.length * 0.032).toFixed(2);
    return `<span class="w" style="--d:${d}s;--a:${(0.84 + r() * 0.16).toFixed(2)};--r:${((r() - 0.5) * 1.3).toFixed(2)}deg;--y:${((r() - 0.5) * 1.4).toFixed(1)}px">${w}</span>`;
  }).join(' ');
  $('cartaText').innerHTML =
    `<h2>${words(C.titulo)}</h2>${CARTA_FLOURISH}` +
    `<p class="saludo">${words(C.saludo)}</p>` +
    C.parrafos.map((p) => `<p>${words(p)}</p>`).join('') +
    `<p class="cierre">${words(C.cierre)}</p><p class="firma">${words(C.firma)}</p>${CARTA_SWASH}` +
    `<div class="carta-seal" id="cartaSeal">${waxSeal(NAME[0])}</div>`;
  carta.words = [...$('cartaText').querySelectorAll('.w')];
}
const cartaLater = (fn, ms) => carta.timers.push(setTimeout(fn, ms));
function cartaQuillTo(w) {
  // la punta de la pluma (abajo a la izquierda del dibujo) queda al final de la palabra
  const q = $('cartaQuill');
  q.style.left = `${w.offsetLeft + w.offsetWidth - 2}px`;
  q.style.top = `${w.offsetTop + w.offsetHeight * 0.8 - 46}px`;   // 46 = alto del dibujo (un SVG no tiene offsetHeight)
}
// mantiene a la vista la línea que se está escribiendo
function cartaFollow(el) {
  const s = $('cartaSheet');
  // solo baja cuando la línea pasa del 75% de lo visible, y la deja a media altura
  if (el.offsetTop + el.offsetHeight > s.scrollTop + s.clientHeight * 0.75) {
    s.scrollTo({ top: el.offsetTop - s.clientHeight * 0.5, behavior: 'smooth' });
  }
}
function cartaStep() {
  if (!carta.open) return;
  const w = carta.words[carta.i++];
  if (!w) { finishCarta(); return; }
  w.classList.add('on');
  cartaQuillTo(w);
  cartaFollow(w);
  // pausa corta entre palabras, más larga tras puntuación y al terminar cada párrafo
  const ms = !w.nextElementSibling ? 700 : /[.,:;!?…]$/.test(w.textContent) ? 320 : 50 + w.textContent.length * 16 + Math.random() * 30;
  cartaLater(cartaStep, ms);
}
function finishCarta() {
  if (!carta.open || carta.read) return;
  carta.timers.forEach(clearTimeout); carta.timers = [];
  carta.words.forEach((w) => w.classList.add('on'));
  carta.read = true;
  const el = $('carta');
  el.classList.add('unrolled', 'done');
  el.classList.remove('writing');
  cartaLater(() => { $('cartaSeal').classList.add('on'); cartaFollow($('cartaSeal')); sfx.pop(); }, 350);
  cartaLater(() => sfx.sparkle(), 700);
}
function openCarta() {
  if (carta.open) return;
  buildCarta();
  Object.assign(carta, { open: true, i: 0, read: false });
  const el = $('carta');
  el.classList.remove('unrolled', 'done', 'writing');
  $('cartaSheet').scrollTop = 0;
  el.classList.add('open');
  sfx.sparkle();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { finishCarta(); return; }
  cartaLater(() => el.classList.add('unrolled'), 250);
  // empieza a escribir cuando el pergamino ya terminó de desenrollarse (0.25 s + 1.5 s)
  cartaLater(() => { el.classList.add('writing'); cartaStep(); }, 1850);
}
function closeCarta() {
  if (!carta.open) return;
  carta.open = false;
  carta.timers.forEach(clearTimeout); carta.timers = [];
  $('carta').classList.remove('open', 'writing');
  CONFIG.levels[FINALE].onCartaClose?.(carta.read);
}
$('cartaClose').addEventListener('click', closeCarta);
$('carta').addEventListener('click', (e) => { if (e.target === $('carta')) closeCarta(); });
$('cartaSheet').addEventListener('click', () => { if (carta.open && $('carta').classList.contains('unrolled')) finishCarta(); });

/* ---------- álbum de fotos: un libro cuyas hojas giran en 3D ---------- */
// en pantallas angostas se ve una sola página a la vez (misma condición que en styles.css)
const singlePage = matchMedia('(max-width: 720px), (max-aspect-ratio: 1/1)');
// face: cara visible, de 0 (portada) a la última (contraportada); cada hoja tiene dos caras
const albumUI = { open: false, face: 0, sheets: [], obj: null, timer: 0 };
document.fonts.load('600 20px Caveat');   // para que las leyendas no cambien de letra al abrirlo

function buildAlbum() {
  const { title, cover, dedication, closing, photos } = CONFIG.album;
  const coverArt = (inner) => `<div class="album-cover">${inner}</div>`;
  const pages = [
    coverArt(`<h2>${title}</h2><img src="${cover}" alt=""><small>con Bubu y Dudu</small>`),
    `<div class="page-text"><h3>Para ${NAME}</h3><p>${dedication}</p></div>`,
    ...photos.map((p, k) => `<figure style="--tilt:${k % 2 ? 1.3 : -1.1}deg"><img src="${p.src}" alt="${p.cap}"><figcaption>${p.cap}</figcaption></figure>`),
    `<div class="page-text"><h3>¡Feliz cumpleaños!</h3><p>${closing}</p></div>`,
    coverArt('<small class="album-end">✦</small>'),
  ];
  // cada hoja lleva dos páginas: con un número impar de fotos sobra un lado en blanco
  if (pages.length % 2) pages.splice(-2, 0, '');
  for (let i = 0; i < pages.length; i += 2) {
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.innerHTML = `<div class="face front">${pages[i]}</div><div class="face back">${pages[i + 1]}</div>`;
    $('book').append(sheet);
    albumUI.sheets.push(sheet);
  }
}
function renderAlbum() {
  const { face, sheets } = albumUI, N = sheets.length, last = N * 2 - 1;
  const flipped = Math.ceil(face / 2);
  sheets.forEach((sheet, i) => {
    const on = i < flipped;
    if (on !== sheet.classList.contains('flipped')) {
      sheet.classList.toggle('flipped', on);
      sheet.classList.remove('turning');
      void sheet.offsetWidth;               // reinicia la sombra del giro
      sheet.classList.add('turning');
    }
    // la separación en Z mantiene el orden de las hojas de cada lado del lomo
    sheet.style.transform = `translateZ(${on ? i + 1 : N - i}px) rotateY(${on ? -180 : 0}deg)`;
  });
  // centra lo que se ve: el libro cerrado o, en móvil, la página actual
  const shift = singlePage.matches ? (face % 2 ? 25 : -25) : (flipped === 0 ? -25 : flipped === N ? 25 : 0);
  $('book').style.transform = `translateX(${shift}%)`;
  const total = last - 1;
  $('albumCount').textContent = face === 0 ? 'Portada' : face === last ? 'Contraportada'
    : singlePage.matches ? `${face} de ${total}` : `${2 * flipped - 1}–${2 * flipped} de ${total}`;
  $('albumPrev').disabled = face === 0;
  $('albumNext').disabled = face === last;
}
buildAlbum();   // desde el inicio, para que las fotos ya estén cargadas al abrirlo
renderAlbum();
singlePage.addEventListener('change', () => { if (albumUI.open) renderAlbum(); });
function albumStep(dir) {
  clearTimeout(albumUI.timer);
  const { face, sheets } = albumUI, flipped = Math.ceil(face / 2);
  const next = singlePage.matches ? face + dir : dir > 0 ? 2 * flipped + 1 : 2 * flipped - 3;
  albumUI.face = THREE.MathUtils.clamp(next, 0, sheets.length * 2 - 1);
  renderAlbum();
}
// el libro sale volando desde donde está el álbum en la escena hasta el centro de la pantalla
function openAlbum(obj) {
  clearTimeout(albumUI.timer);
  albumUI.obj = obj;
  albumUI.face = 0;
  renderAlbum();
  const fly = $('bookFly');
  const r = canvas.getBoundingClientRect(), sr = $('albumScene').getBoundingClientRect();
  const p = obj.getWorldPosition(new THREE.Vector3()).project(camera);
  const pxPerUnit = (r.height * camera.zoom) / (camera.top - camera.bottom);
  fly.style.transition = 'none';
  fly.style.setProperty('--from-x', `${r.left + ((p.x + 1) / 2) * r.width - (sr.left + sr.width / 2)}px`);
  fly.style.setProperty('--from-y', `${r.top + ((1 - p.y) / 2) * r.height - (sr.top + sr.height / 2)}px`);
  fly.style.setProperty('--from-s', (1.6 * pxPerUnit / fly.offsetHeight).toFixed(3));
  void fly.offsetWidth;
  fly.style.transition = '';
  $('album').classList.add('open');
  albumUI.open = true;
  obj.visible = false;
  $('albumNext').focus({ preventScroll: true });
  albumUI.timer = setTimeout(() => albumStep(1), 950);   // aterriza y se abre la portada
}
function closeAlbum() {
  if (!albumUI.open) return;
  clearTimeout(albumUI.timer);
  albumUI.open = false;
  albumUI.face = 0;
  renderAlbum();
  $('album').classList.remove('open');
  albumUI.timer = setTimeout(() => { albumUI.obj.visible = true; }, 650);
}
$('albumClose').addEventListener('click', closeAlbum);
$('albumPrev').addEventListener('click', () => albumStep(-1));
$('albumNext').addEventListener('click', () => albumStep(1));
$('album').addEventListener('click', (e) => { if (e.target === $('album')) closeAlbum(); });
// tocar un lado pasa la página, deslizar también; fuera del libro cierra
let albumDown = null;
$('albumScene').addEventListener('pointerdown', (e) => {
  albumDown = { x: e.clientX, y: e.clientY, onBook: !!e.target.closest('.face') };
});
$('albumScene').addEventListener('pointerup', (e) => {
  if (!albumDown) return;
  const { x, y, onBook } = albumDown, dx = e.clientX - x, dy = e.clientY - y;
  albumDown = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { albumStep(dx < 0 ? 1 : -1); return; }
  if (Math.hypot(dx, dy) > 10) return;
  if (!onBook) { closeAlbum(); return; }
  const r = $('albumScene').getBoundingClientRect();
  const last = albumUI.sheets.length * 2 - 1;
  albumStep(albumUI.face === 0 ? 1 : albumUI.face === last ? -1 : e.clientX >= r.left + r.width / 2 ? 1 : -1);
});

    $('ipLeft').textContent = `-${fmtTime(Math.max(0, d - c))}`;
  }
  // luz de fondo (y relleno de la pantalla) con los colores de lo que se ve
  if (t - ipod.lastGlow > 0.12 && ipVideo.readyState >= 2) {
    ipod.lastGlow = t;
    const src = ipod.view === 'video' ? ipVideo : $('ipCover');
    const g = $('ipodGlow');
    g.getContext('2d').drawImage(src, 0, 0, g.width, g.height);
    if (IPOD_TRACKS[ipod.track].fit === 'contain' && ipod.view === 'video') {
      const bk = $('ipBack');
      // recorte vertical del centro del video, para que el fondo continúe la imagen
      const vw = ipVideo.videoWidth, vh = ipVideo.videoHeight, sw = Math.min(vw, vh * (9 / 16));
      bk.getContext('2d').drawImage(ipVideo, (vw - sw) / 2, 0, sw, vh, 0, 0, bk.width, bk.height);
    }
  }
});

// el video siempre queda visible: dentro del reproductor, o como mini reproductor sobre la escena
function syncVideo() {
  if (!music.yt) return;                 // sin reproductor creado no hay nada que acomodar
  const wrap = $('ytWrap');
  let r = null, mini = false;
  if (music.yt && music.open) {
    r = (music.mode === 'video' ? $('plStage') : $('plMiniSlot')).getBoundingClientRect();
  } else if (music.yt && music.started) {
    const s = stage.getBoundingClientRect();
    const narrow = innerWidth <= 860;
    const w = narrow ? 168 : 240, h = (w * 9) / 16;
    r = { left: narrow ? s.right - w - 12 : s.left + 16, top: narrow ? s.top + 56 : s.bottom - h - 16, width: w, height: h };
    mini = true;
  }
  wrap.classList.toggle('show', !!r);
  wrap.classList.toggle('mini', mini);
  if (r) Object.assign(wrap.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  // barra de progreso
  if (music.open && music.yt?.getDuration) {
    const d = music.yt.getDuration(), c = music.yt.getCurrentTime();
    if (d > 0) {
      $('plDur').textContent = fmtTime(d);
      $('plCur').textContent = fmtTime(c);
      if (!music.seeking) $('plSeek').value = Math.round((c / d) * 1000);
    }
  }
}

// sombras y luces puntuales solo en los pisos activos: cada luz encendida
// se calcula en cada píxel de cada objeto, aunque esté en otro piso
function setShadowCasters(active) {
  levels.forEach((g, i) => g.traverse((o) => {
    if (o.isMesh) o.castShadow = active.includes(i) && !o.userData.noShadow;
    else if (o.isPointLight) o.visible = active.includes(i);
  }));
}
/* ---------- agrupado de mallas: muchas piezas → pocas llamadas de dibujo ---------- */
// Cada pieza (un libro, un ladrillo, una oreja…) era una llamada de dibujo, y otra más en el pase
// de sombras: ~900 por cuadro. Aquí las mallas de un piso que comparten material se dibujan juntas
// en un BatchedMesh. La malla original sigue en la escena (para animarla y para los clics) pero en
// la capa 1, que la cámara no dibuja; cada cuadro se copia su posición al lote solo si cambió.
const batches = [];
const SMALL_SHADOW = 0.075;   // radio (m) bajo el cual una pieza no proyecta sombra: no se nota
function buildBatches() {
  const BASE = ['normal', 'position', 'uv'].join();
  levels.forEach((L, li) => {
    L.updateMatrixWorld(true);
    const groups = new Map();
    L.traverse((o) => {
      if (!o.isMesh || o.isInstancedMesh || o.isBatchedMesh) return;
      const g = o.geometry, m = o.material;
      // piezas diminutas (ojos, bigotes, mechas): sin sombra propia
      if (!g.boundingSphere) g.computeBoundingSphere();
      const ws = o.matrixWorld.getMaxScaleOnAxis();
      if (g.boundingSphere.radius * (ws < 0.5 ? 1 : ws) < SMALL_SHADOW) o.userData.noShadow = true;
      if (Array.isArray(m) || m.transparent || !m.colorWrite || !(m.isMeshStandardMaterial || m.isMeshBasicMaterial)) return;
      if (o.renderOrder !== 0 || o.userData.noBatch || g.morphAttributes.position) return;
      if (Object.keys(g.attributes).sort().join() !== BASE) return;
      if (o.matrixWorld.determinant() < 0) return;          // piezas en espejo: el lote no las admite
      // con y sin índice van en lotes distintos (las cajas redondeadas no tienen índice)
      const key = `${m.uuid}|${o.userData.noShadow ? 0 : 1}|${o.receiveShadow ? 1 : 0}|${g.index ? 1 : 0}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(o);
    });
    for (const list of groups.values()) {
      if (list.length < 3) continue;
      const geos = [...new Set(list.map((o) => o.geometry))];
      const verts = geos.reduce((n, g) => n + g.attributes.position.count, 0);
      const idx = geos.reduce((n, g) => n + (g.index ? g.index.count : 0), 0);
      let mesh;
      try {
        mesh = new THREE.BatchedMesh(list.length, verts, idx, list[0].material);
        const ids = new Map(geos.map((g) => [g, mesh.addGeometry(g)]));
        mesh.userData.noShadow = !!list[0].userData.noShadow;
        mesh.receiveShadow = list[0].receiveShadow;
        mesh.frustumCulled = false;          // cada pieza se descarta por separado
        mesh.sortObjects = false;
        mesh.raycast = () => {};             // los clics siguen yendo a las mallas originales
        const members = list.map((o) => {
          const id = mesh.addInstance(ids.get(o.geometry));
          o.layers.set(1);
          return { o, id, geo: o.geometry, ver: o.geometry.attributes.position.version, vis: true, world: new Float32Array(16).fill(NaN), rel: new THREE.Matrix4() };
        });
        L.add(mesh);
        batches.push({ L, li, mesh, material: list[0].material, members });
      } catch (e) {
        // si el navegador no puede con el lote, esas piezas se dibujan como siempre
        list.forEach((o) => o.layers.set(0));
        mesh?.dispose();
      }
    }
  });
  raycaster.layers.enable(1);
  scene.matrixWorldAutoUpdate = false;      // se actualiza una vez por cuadro, en syncBatches()
}
const _bInv = new THREE.Matrix4(), _bRel = new THREE.Matrix4();
function syncBatches() {
  if (!batches.length) return;
  scene.updateMatrixWorld();
  for (const b of batches) {
    // solo los pisos que caben en pantalla: el actual y sus vecinos
    if (!b.L.visible || Math.abs(b.li - state.level) > 1) continue;
    let invReady = false;
    for (const m of b.members) {
      if (m.out) continue;
      const o = m.o;
      // si cambió de material o de forma, vuelve a dibujarse por su cuenta
      if (o.material !== b.material || o.geometry !== m.geo || m.geo.attributes.position.version !== m.ver) {
        m.out = true; o.layers.set(0); b.mesh.setVisibleAt(m.id, false);
        continue;
      }
      let vis = true, p = o;
      for (; p && p !== b.L; p = p.parent) if (!p.visible) { vis = false; break; }
      if (!p) vis = false;                   // la quitaron de la escena
      if (vis !== m.vis) { m.vis = vis; b.mesh.setVisibleAt(m.id, vis); }
      if (!vis) continue;
      const e = o.matrixWorld.elements, w = m.world;
      let same = true;
      for (let i = 0; i < 16; i++) if (e[i] !== w[i]) { same = false; break; }
      if (same) continue;
      w.set(e);
      if (!invReady) { _bInv.copy(b.L.matrixWorld).invert(); invReady = true; }
      _bRel.multiplyMatrices(_bInv, o.matrixWorld);
      // el piso entero se mueve al cambiar de nivel: respecto al piso, la pieza sigue igual
      const a = _bRel.elements, r = m.rel.elements;
      let moved = false;
      for (let i = 0; i < 16; i++) if (Math.abs(a[i] - r[i]) > 1e-5) { moved = true; break; }
      if (!moved) continue;
      if (_bRel.determinant() < 0) { m.out = true; o.layers.set(0); b.mesh.setVisibleAt(m.id, false); continue; }
      m.rel.copy(_bRel);
      b.mesh.setMatrixAt(m.id, _bRel);
    }
  }
}

// precompila los shaders de cada combinación de luces para que cambiar de piso no dé tirones
function warmShaders() {
  // el piso secreto está oculto: se muestra un instante (sin dibujar) para prepararlo también
  const hidden = levels.filter((g) => !g.visible);
  hidden.forEach((g) => { g.visible = true; });
  const combos = levels.flatMap((_, i) => [[i], ...levels.map((_, j) => [i, j]).slice(i + 1)]);
  for (const c of combos) { setShadowCasters(c); renderer.compileAsync(scene, camera).catch(() => {}); }
  // sube a la GPU las texturas que aún no se han visto (si no, se suben al primer vistazo y traban)
  scene.traverse((o) => { if (o.material?.map) renderer.initTexture(o.material.map); });
  hidden.forEach((g) => { g.visible = false; });
  setShadowCasters([state.level]);
}

let shadowTimer;
function goTo(i) {
  i = THREE.MathUtils.clamp(i, 0, maxLevel());
  if (i === state.level) return;
  CONFIG.levels[i].onEnter?.();
  if (view.close) setClose(false);
  const prev = state.level;
  state.level = i;
  setShadowCasters([prev, i]);
  clearTimeout(shadowTimer);
  shadowTimer = setTimeout(() => setShadowCasters([state.level]), 1100);
  const content = $('content');
  content.classList.add('swap');
  setTimeout(() => { renderPanel(i); content.classList.remove('swap'); }, 220);
}

$('up').addEventListener('click', () => goTo(state.level + 1));
$('down').addEventListener('click', () => goTo(state.level - 1));
$('action').addEventListener('click', () => CONFIG.levels[state.level].run?.());
addEventListener('keydown', (e) => {
  if (ipod.open) {
    const inField = e.target.tagName === 'INPUT';
    if (e.key === 'Escape') closeIpod();
    else if (e.key === ' ' && !inField) { e.preventDefault(); ipTogglePlay(true); }
    else if (e.key === 'ArrowLeft' && !inField) ipSkip(-5);
    else if (e.key === 'ArrowRight' && !inField) ipSkip(5);
    else if (e.key === 'ArrowUp') { e.preventDefault(); ipScroll(ipod.menu ? -1 : 1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); ipScroll(ipod.menu ? 1 : -1); }
    else if (e.key === 'Enter' && ipod.menu) { e.preventDefault(); ipCenter(); }
    else if (e.key === 'Backspace' && ipod.menu) { e.preventDefault(); ipMenuBack(); }
    return;
  }
  if (albumUI.open) {
    if (e.key === 'Escape') closeAlbum();
    if (e.key === 'ArrowRight') albumStep(1);
    if (e.key === 'ArrowLeft') albumStep(-1);
    return;
  }
  if (e.key === 'Escape') { closeCarta(); closeModal(); closePlayer(); if (view.close) setClose(false); return; }
  if (e.key === 'ArrowUp') goTo(state.level + 1);
  if (e.key === 'ArrowDown') goTo(state.level - 1);
});
let wheelLock = 0;
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (view.close) { zoomBy(Math.exp(-e.deltaY * 0.0015)); return; }
  if (performance.now() < wheelLock || Math.abs(e.deltaY) < 20) return;
  wheelLock = performance.now() + 900;
  goTo(state.level + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

/* ---------- puntero: parallax, hover, clic ---------- */
const raycaster = new THREE.Raycaster();
raycaster.params.Line.threshold = 0.01;
raycaster.params.Points.threshold = 0.01;
const ndc = new THREE.Vector2(-10, -10);
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
let hovered = null, pickDirty = false;
let down = null;

function updateNdc(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ptr.tx = ndc.x; ptr.ty = ndc.y;
}
function pick() {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(levels[state.level], true);
  for (const h of hits) {
    if (!h.object.visible) continue;
    let o = h.object;
    while (o && !o.userData.interactive) o = o.parent;
    return o && o.userData.interactive.level === state.level ? o : null;
  }
  return null;
}
canvas.addEventListener('pointermove', (e) => {
  updateNdc(e);
  if (down && view.close) {
    // arrastrar = girar la cámara alrededor del cuarto
    const cv = closeView();
    view.dTheta -= (e.clientX - down.lx) * 0.005;
    if (!cv.free) view.dTheta = THREE.MathUtils.clamp(view.dTheta, cv.dMin, cv.dMax);
    view.phi = THREE.MathUtils.clamp(view.phi - (e.clientY - down.ly) * 0.004, cv.phiMin, cv.phiMax);
    down.lx = e.clientX; down.ly = e.clientY;
  }
  if (e.pointerType === 'mouse') pickDirty = true;
});
canvas.addEventListener('pointerleave', () => { pickDirty = false; hovered = null; ptr.tx = ptr.ty = 0; canvas.style.cursor = ''; });
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  updateNdc(e);
});
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  down = null;
  if (!view.close && e.pointerType !== 'mouse' && Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) {
    goTo(state.level + (dy > 0 ? 1 : -1));
    return;
  }
  if (Math.hypot(dx, dy) > 8) return;
  updateNdc(e);
  const o = pick();
  if (o) o.userData.interactive.onClick();
  if (e.pointerType !== 'mouse') { ptr.tx = ptr.ty = 0; }
});

/* =========================================================
   Tamaño y bucle de render
   ========================================================= */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  const aspect = w / h;
  const viewH = Math.max(13, 17 / aspect);
  camera.left = (-viewH * aspect) / 2;
  camera.right = (viewH * aspect) / 2;
  camera.top = viewH / 2;
  camera.bottom = -viewH / 2;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const camBase = new THREE.Spherical().setFromVector3(new THREE.Vector3(1, 0.82, 1));
const camSph = new THREE.Spherical();
const target = new THREE.Vector3(1.2, state.camY, -1.2);
const cam = { theta: camBase.theta, phi: camBase.phi };
const clock = new THREE.Clock();

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  state.camY = damp(state.camY, levelCamY(state.level), 3.2, dt);
  // los niveles de arriba flotan separados para que se vea el actual completo
  levels.forEach((g, j) => {
    g.position.y = damp(g.position.y, j * H + (j > state.level ? LIFT : 0), 3.2, dt);
  });
  ptr.x = damp(ptr.x, ptr.tx, 3, dt);
  ptr.y = damp(ptr.y, ptr.ty, 3, dt);
  const close = view.close;
  cam.theta = damp(cam.theta, close ? CLOSE_THETA + view.dTheta : camBase.theta + ptr.x * 0.1, close ? 6 : 3, dt);
  cam.phi = damp(cam.phi, close ? view.phi : camBase.phi + ptr.y * 0.05, close ? 6 : 3, dt);
  const ct = closeTargets[state.level] || closeTargets[0];
  target.x = damp(target.x, close ? ct.x : 1.2, 3, dt);
  target.z = damp(target.z, close ? ct.z : -1.2, 3, dt);
  target.y = damp(target.y, close ? ct.y : state.camY, close ? 3 : 8, dt);
  camSph.set(60, cam.phi, cam.theta);
  camera.position.setFromSpherical(camSph).add(target);
  camera.lookAt(target);
  camera.zoom = damp(camera.zoom, close ? view.zoom : 1, 2.5, dt);
  camera.updateProjectionMatrix();

  sun.position.copy(target).add(sunOffset);
  sun.target.position.copy(target);

  for (const o of interactives) {
    const k = o === hovered ? 1.06 : 1;
    o.scale.setScalar(damp(o.scale.x, o.userData.baseScale * k, 12, dt));
  }
  for (const fn of tickers) fn(t, dt);
  confetti.update(dt, t);
  syncVideo();

  // con una ventana a pantalla completa abierta, la casa no se ve: no se dibuja
  if (!overlayOpen()) {
    // el objeto bajo el cursor se calcula una vez por cuadro, no en cada evento del mouse
    if (pickDirty) {
      pickDirty = false;
      hovered = pick();
      canvas.style.cursor = hovered ? 'pointer' : '';
    }
    syncBatches();
    renderer.render(scene, camera);
    adaptQuality(dt);
  }
  requestAnimationFrame(frame);
}
const overlays = ['modal', 'album', 'player', 'ipod', 'carta'].map($).filter(Boolean);
const overlayOpen = () => overlays.some((el) => el.classList.contains('open'));
// si el equipo no aguanta (~40 fps), baja la resolución interna poco a poco
function adaptQuality(dt) {
  if (clock.elapsedTime < 3) return;   // ignora el arranque (carga de shaders y texturas)
  perf.acc += dt; perf.n++;
  if (perf.n < 90) return;
  const avg = perf.acc / perf.n;
  perf.acc = perf.n = 0;
  if (avg > 1 / 40 && perf.dpr > perf.minDpr) {
    perf.dpr = Math.max(perf.minDpr, perf.dpr - 0.25);
    renderer.setPixelRatio(perf.dpr);
    sparkMat.uniforms.uPR.value = perf.dpr;
    resize();
  }
}

if (!params.has('sinlotes')) buildBatches();
setShadowCasters([state.level]);
renderPanel(state.level);
CONFIG.levels[state.level].onEnter?.();
if (closeTargets[state.level] && params.has('cerca')) {
  setClose(true);
  Object.assign(cam, { theta: CLOSE_THETA, phi: view.phi });
  camera.zoom = view.zoom;
  target.copy(closeTargets[state.level]);
}
// compila los shaders del piso inicial sin congelar la página
try { await renderer.compileAsync(scene, camera); } catch (e) {}
frame();
requestAnimationFrame(() => $('loader').classList.add('hide'));
(window.requestIdleCallback || setTimeout)(warmShaders, { timeout: 3000 });
</script>
</body>
</html>
